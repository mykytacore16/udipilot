<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instalacja UDIPilot</title>
<style>
  :root {
    --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --muted: #6e6e73; --faint: #86868b;
    --border: rgba(0,0,0,.08); --fill: rgba(120,120,128,.12);
    --primary: #0071e3; --primary-2: #0077ed; --primary-soft: rgba(0,113,227,.09);
    --green: #248a3d; --green-c: #34c759; --green-soft: rgba(52,199,89,.12);
    --orange-soft: rgba(255,149,0,.12); --red: #d70015; --red-soft: rgba(255,59,48,.09);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); display: grid; place-items: center; padding: 32px 16px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { width: min(560px, 100%); background: var(--surface); border-radius: 22px; box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 24px 60px rgba(0,0,0,.08); overflow: hidden; }
  .pad { padding: 32px 36px; }
  .head { display: flex; align-items: center; gap: 14px; }
  .logo { width: 48px; height: 48px; border-radius: 13px; background: linear-gradient(180deg, #2b8cff, #0066d6); display: grid; place-items: center; color: #fff; flex-shrink: 0; box-shadow: 0 6px 16px rgba(0,113,227,.3); }
  .logo svg { width: 26px; height: 26px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.4px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 26px 0 10px; }
  svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .list { border-radius: 14px; background: var(--bg); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 46px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .lbl { flex: 1; min-width: 0; }
  .row .lbl b { font-weight: 500; display: block; }
  .row .lbl small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; }
  .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .ic svg { width: 13px; height: 13px; stroke-width: 3; }
  .ic.ok { background: var(--green-c); color: #fff; }
  .ic.warn { background: #ff9f0a; color: #fff; }
  .ic.err { background: #ff3b30; color: #fff; }
  .ic.pending { border: 2px solid #d2d2d7; }
  .ic.skip { border: 2px dashed #c7c7cc; }
  .ic.run { border: 2px solid var(--fill); border-top-color: var(--primary); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .row.running .lbl b { font-weight: 600; }
  .row.skip .lbl b, .row.pending .lbl b { color: var(--faint); }
  .row.error .lbl small { color: var(--red); white-space: normal; }

  /* przełącznik iOS */
  .sw { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; border-radius: 13px; background: #e5e5ea; transition: background .2s; cursor: pointer; }
  .sw span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .sw input:checked + span { background: var(--green-c); }
  .sw input:checked + span::after { transform: translateX(18px); }
  .sw input:disabled + span { opacity: .5; cursor: not-allowed; }

  .bar { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .4s ease; }
  .total { margin-top: 18px; }
  .total .bar { height: 6px; }
  .total .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

  .foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 18px 36px; border-top: 1px solid var(--border); background: #fbfbfd; }
  .foot .note { margin-right: auto; font-size: 12px; color: var(--muted); }
  .btn { appearance: none; border: 0; border-radius: 999px; padding: 9px 20px; font: inherit; font-weight: 500; cursor: pointer; background: var(--fill); color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, transform .1s; }
  .btn:hover { background: rgba(120,120,128,.2); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }
  .link { background: none; border: 0; color: var(--primary); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }

  .alert { border-radius: 12px; padding: 11px 14px; font-size: 13px; margin-top: 14px; }
  .alert.info { background: var(--primary-soft); color: #0b3d75; }
  .alert.warn { background: var(--orange-soft); color: #6e3a00; }
  .alert.err { background: var(--red-soft); color: #86160f; }
  .log { margin-top: 12px; background: #1d1d1f; color: #d2d2d7; border-radius: 12px; padding: 12px 14px; font: 11.5px/1.5 ui-monospace, 'SF Mono', Consolas, monospace; height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

  .done { text-align: center; padding: 44px 36px 30px; }
  .done .big { width: 72px; height: 72px; border-radius: 50%; background: var(--green-c); color: #fff; display: grid; place-items: center; margin: 0 auto 18px; animation: pop .4s cubic-bezier(.2,.9,.3,1.3); }
  .done .big svg { width: 36px; height: 36px; stroke-width: 3; }
  .done .big.err { background: #ff3b30; }
  .done h1 { font-size: 28px; }
  .done p { color: var(--muted); margin: 8px auto 0; max-width: 400px; }
  .done .list { text-align: left; margin-top: 22px; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fade { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card" id="app"><div class="pad"><div class="sub">Ładowanie…</div></div></div>

<script>
const I = {
  logo: '<svg viewBox="0 0 24 24"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>',
  check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  x: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  arrow: '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  play: '<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
  retry: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/></svg>',
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = null, showLog = false, opts = null, launching = false, lastPhase = null;

const head = (sub) => `<div class="head"><div class="logo">${I.logo}</div><div><h1>UDIPilot</h1><div class="sub">${sub}</div></div></div>`;
const icon = (k) => k === 'ok' || k === 'done' ? `<span class="ic ok">${I.check}</span>` : k === 'warn' ? `<span class="ic warn">${I.warn}</span>`
  : k === 'err' || k === 'error' ? `<span class="ic err">${I.x}</span>` : k === 'running' ? '<span class="ic run"></span>' : `<span class="ic ${k}"></span>`;
const row = (st, title, small, extra = '', cls = '') => `<div class="row ${cls}">${icon(st)}<div class="lbl"><b>${title}</b>${small ? `<small>${small}</small>` : ''}${extra}</div></div>`;

function welcome() {
  const c = S.checks;
  if (!c) return `<div class="pad">${head('Sprawdzanie komputera…')}</div>`;
  if (!opts) opts = { ...S.options };
  const lowDisk = c.disk != null && c.disk < 8;
  const port = c.port === 'free' ? ['ok', 'wolny'] : c.port === 'udipilot' ? ['warn', 'UDIPilot już działa – zostanie zaktualizowany'] : ['warn', 'zajęty przez inny program'];
  const ai = c.ollama.hasModel ? 'Bielik jest już pobrany' : c.ollama.installed ? 'Ollama zainstalowana · pobranie modelu ok. 5 GB' : 'instaluje Ollama i pobiera model (ok. 5 GB)';
  return `<div>
    <div class="pad">
      ${head(c.installed ? 'Aktualizacja – Twoje dane zostaną zachowane' : 'Inteligentny asystent urzędnika · instalacja')}
      <h2>Twój komputer</h2>
      <div class="list">
        ${row(c.node.ok ? 'ok' : 'err', 'Node.js', `wersja ${c.node.version}${c.node.ok ? '' : ' – wymagana 22.5 lub nowsza'}`)}
        ${row('ok', 'System', `${esc(c.os)} · ${c.ram} GB RAM`)}
        ${c.disk != null ? row(lowDisk ? 'warn' : 'ok', 'Wolne miejsce', `${c.disk} GB${lowDisk ? ' – za mało na lokalny model AI' : ''}`) : ''}
        ${row(port[0], 'Port 3000', port[1])}
      </div>
      <h2>Opcje</h2>
      <div class="list">
        <label class="row" style="cursor:pointer"><div class="lbl"><b>Lokalny model AI – Bielik</b><small>${ai}. Działa bez Internetu, dane nie opuszczają komputera.</small></div>
          <span class="sw"><input type="checkbox" id="o-ai" ${opts.ai ? 'checked' : ''} ${lowDisk ? 'disabled' : ''}><span></span></span></label>
        <label class="row" style="cursor:pointer"><div class="lbl"><b>Skrót na pulpicie</b><small>Ikona „UDIPilot” do codziennego uruchamiania</small></div>
          <span class="sw"><input type="checkbox" id="o-sc" ${opts.shortcut ? 'checked' : ''}><span></span></span></label>
      </div>
      <div class="alert info">Aplikacja działa także bez AI. Model można podłączyć później przyciskiem „Podłącz AI”.</div>
    </div>
    <div class="foot"><span class="note">Czas: ok. 2 min${opts.ai && !c.ollama.hasModel ? ' + pobieranie modelu' : ''}</span>
      <button class="btn primary" id="go" ${c.node.ok ? '' : 'disabled'}>${c.installed ? 'Zaktualizuj' : 'Zainstaluj'} ${I.arrow}</button></div>
  </div>`;
}

function progress() {
  const steps = S.steps.filter((s) => !(s.id === 'model' && s.state === 'skip' && S.steps.find((x) => x.id === 'ollama').state === 'skip'));
  const w = (s) => (s.id === 'model' ? 4 : 1);
  const tot = steps.reduce((a, s) => a + w(s), 0);
  const doneW = steps.reduce((a, s) => a + (s.state === 'done' || s.state === 'skip' ? w(s) : s.state === 'running' ? w(s) * (s.progress || 0.15) : 0), 0);
  const pct = Math.round((doneW / tot) * 100);
  const cur = S.steps.find((s) => s.state === 'running');
  const err = S.phase === 'error';
  return `<div>
    <div class="pad">
      ${head(err ? 'Instalacja przerwana' : 'Instalowanie…')}
      <div class="total"><div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>${err ? 'Wystąpił problem' : esc(cur?.label || 'Przygotowanie')}</span><span>${pct}%</span></div></div>
      <h2>Kroki</h2>
      <div class="list">
        ${steps.map((s) => row(s.state, esc(s.label), esc(s.detail),
          s.state === 'running' && s.progress != null ? `<div class="bar"><i style="width:${Math.round(s.progress * 100)}%"></i></div>` : '', s.state)).join('')}
      </div>
      ${err ? `<div class="alert err">${esc(S.error)}</div>` : ''}
      <div style="margin-top:14px"><button class="link" id="tl">${showLog ? 'Ukryj szczegóły' : 'Pokaż szczegóły'}</button></div>
      <div class="log ${showLog ? '' : 'hidden'}" id="log">${esc(S.log.join('\n'))}</div>
    </div>
    ${err ? `<div class="foot">${S.options.ai ? '<button class="btn" id="noai">Kontynuuj bez AI</button>' : ''}<button class="btn primary" id="retry">${I.retry} Spróbuj ponownie</button></div>` : ''}
  </div>`;
}

function done() {
  const items = S.steps.filter((s) => s.state === 'done');
  return `<div>
    <div class="done">
      <div class="big">${I.check}</div>
      <h1>Gotowe</h1>
      <p>UDIPilot jest zainstalowany${S.options.ai ? ' razem z lokalnym modelem Bielik' : ''}. ${S.options.shortcut ? 'Następnym razem uruchomisz go skrótem na pulpicie.' : ''}</p>
      <div class="list">${items.map((s) => row('ok', esc(s.label), esc(s.detail))).join('')}</div>
    </div>
    <div class="foot"><span class="note">Adres aplikacji: localhost:3000</span>
      <button class="btn" id="close">Zamknij</button>
      <button class="btn primary" id="launch" ${launching ? 'disabled' : ''}>${launching ? '<span class="ic run" style="width:16px;height:16px"></span> Uruchamianie…' : `${I.play} Uruchom UDIPilot`}</button></div>
  </div>`;
}

function render() {
  const logEl = $('#log');
  const atBottom = !logEl || logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 10;
  $('#app').innerHTML = S.phase === 'welcome' ? welcome() : S.phase === 'done' ? done() : progress();
  // Animacja tylko przy zmianie ekranu – nie przy każdej aktualizacji postępu.
  const screen = S.phase === 'error' ? 'installing' : S.phase + (S.checks ? '' : '-wait');
  if (screen !== lastPhase) { lastPhase = screen; const f = $('#app').firstElementChild; f?.classList.add('fade'); }
  const l = $('#log');
  if (l && atBottom) l.scrollTop = l.scrollHeight;
  bind();
}

const post = (u, b) => fetch(u, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b || {}) }).then((r) => r.json());
function bind() {
  $('#o-ai')?.addEventListener('change', (e) => { opts.ai = e.target.checked; render(); });
  $('#o-sc')?.addEventListener('change', (e) => { opts.shortcut = e.target.checked; });
  $('#go')?.addEventListener('click', () => post('/install', opts));
  $('#retry')?.addEventListener('click', () => post('/install', S.options));
  $('#noai')?.addEventListener('click', () => post('/install', { ...S.options, ai: false }));
  $('#tl')?.addEventListener('click', () => { showLog = !showLog; render(); });
  $('#close')?.addEventListener('click', () => { post('/quit'); $('#app').innerHTML = `<div class="done"><p>Instalator zamknięty. Możesz zamknąć tę kartę.</p></div>`; });
  $('#launch')?.addEventListener('click', async () => {
    launching = true; render();
    const r = await post('/launch').catch(() => ({ ok: false }));
    if (r.ok) location.href = r.url;
    else { launching = false; render(); alert('Nie udało się uruchomić serwera. Użyj skrótu „UDIPilot” na pulpicie.'); }
  });
}

const es = new EventSource('/events');
es.onmessage = (e) => { S = JSON.parse(e.data); render(); };
es.onerror = () => { if (S?.phase === 'done' && launching) es.close(); };
</script>
</body>
</html>
